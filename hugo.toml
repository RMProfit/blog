baseurl = "https://robertmprofit.com/"
DefaultContentLanguage = "en"
title = "Profit's Blog"
# Using theme as git submodule 
#theme = "beautifulhugo"
# Or when using theme as hugo module
theme = "github.com/halogenica/beautifulhugo/v5"
googleAnalytics = "G-XC9S15QS4V"

[[module.imports]]
    path = "github.com/halogenica/beautifulhugo/v5"

[markup.highlight]
  noClasses = false

# Tag-driven related posts (theme v5.1+ uses Hugo's related-content engine)
[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "keywords"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[Params]
homeTitle = "Profit's Blog" # Set a different text for the header on the home page
subtitle = "Unified Communications and other I.T. Things"
mainSections = ["post","posts"]
logo = "img/resized_image_full_.jpeg" # Expecting square dimensions
# favicon = "img/favicon.ico"
dateFormat = "January 2, 2006"
commit = false
rss = true
comments = true
readingTime = true
wordCount = true
useHLJS = true
socialShare = true
#  delayDisqus = true
showRelatedPosts = true
#  hideAuthor = true
#  gcse = "012345678901234567890:abcdefghijk" # Get your code from google.com/cse. Make sure to go to "Look and Feel" and change Layout to "Full Width" and Theme to "Classic"
disclaimerText = "The opinions expressed herein are my own personal opinions and do not represent my employer’s view in any way."
summaryLength = "35"

